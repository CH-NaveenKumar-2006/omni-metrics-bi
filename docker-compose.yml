version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bi_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-bi_analytics}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds/001_sample_data.sql:/docker-entrypoint-initdb.d/02-seeds.sql

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bi_express_api
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-bi_analytics}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}
    ports:
      - "5000:5000"
    depends_on:
      - db

  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bi_react_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
