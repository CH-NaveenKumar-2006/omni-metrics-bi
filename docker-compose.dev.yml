version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bi_postgres_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-bi_analytics}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds/001_sample_data.sql:/docker-entrypoint-initdb.d/02-seeds.sql

  api:
    image: node:18-alpine
    container_name: bi_api_dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-bi_analytics}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_123}
    ports:
      - "5000:5000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db

  client:
    image: node:18-alpine
    container_name: bi_client_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000/api
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  pgdata_dev:
